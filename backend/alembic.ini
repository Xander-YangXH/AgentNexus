[alembic]
script_location = migrations
# 连接串不写在这里，由 migrations/env.py 从环境变量 DATABASE_URL 读取
prepend_sys_path = package
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
