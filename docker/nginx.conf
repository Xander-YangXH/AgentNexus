server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：任何前端路由都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 请求体上限：Nginx 默认只有 1MB，会挡住知识库文档上传（实测 3.2MB 的文件被拒，且返回的是 HTML 错误页）。
    # 设成略大于应用的 MAX_UPLOAD_MB（默认 10）：10~12MB 由应用返回统一格式的 JSON 错误，只有更大的才在这里被拦。
    # 注意：调大 MAX_UPLOAD_MB 时要同步改这里
    client_max_body_size 12m;

    # 动态解析后端地址：proxy_pass 直接写主机名时，Nginx 只在启动时解析一次并一直用这个 IP。
    # api 容器单独重建后 IP 变了，Nginx 仍连旧地址，返回 502（阶段 2.2 加入 qdrant 后实测踩到）。
    # 127.0.0.11 是 Docker 内置的 DNS；proxy_pass 用变量时才会按 valid 的间隔重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 同源转发：浏览器只访问这一个源，后端不需要配置 CORS
    location /api/ {
        set $api_upstream http://api:8000;  # 不带路径：原样转发请求的 URI，与原来写死地址时行为一致
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host 带端口（localhost:8080），与浏览器的 Origin 一致：后端的 CSRF 检查比较两者（decisions/0023）。
        # 第一版是 $host（不带端口），所有经 Nginx 的写请求都会被当成跨站请求拒绝
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        # SSE 关键：Nginx 默认会缓冲上游响应，攒够才发给浏览器，流式就变成了“一次性”。
        # 后端已在 SSE 响应里带 X-Accel-Buffering: no（Nginx 会遵守），这里再全局关闭作为兜底。
        proxy_buffering off;
        proxy_cache off;

        # 后端空闲时每 15 秒发一次 ": ping"，默认 60 秒读超时已经够用；放宽到 120 秒留余量
        proxy_read_timeout 120s;
    }
}
