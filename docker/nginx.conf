server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：任何前端路由都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源转发：浏览器只访问这一个源，后端不需要配置 CORS
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE 关键：Nginx 默认会缓冲上游响应，攒够才发给浏览器，流式就变成了“一次性”。
        # 后端已在 SSE 响应里带 X-Accel-Buffering: no（Nginx 会遵守），这里再全局关闭作为兜底。
        proxy_buffering off;
        proxy_cache off;

        # 后端空闲时每 15 秒发一次 ": ping"，默认 60 秒读超时已经够用；放宽到 120 秒留余量
        proxy_read_timeout 120s;
    }
}
