# postgres + redis + qdrant + migrate（一次性）+ api + web。后续阶段在此基础上叠加 neo4j / worker 等。
name: agentnexus

# api 与 migrate 共用同一个镜像和环境变量
x-backend: &backend
  image: agentnexus-backend
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  environment:
    # 容器间用服务名互通（postgres / redis），不是 localhost
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    # compose 只会把这里列出的变量传进容器；.env 里写了但这里没列的，容器里读不到
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
    SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-5}
    LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_THINKING: ${LLM_THINKING:-}
    LLM_FAKE_STREAM_DELAY: ${LLM_FAKE_STREAM_DELAY:-0}
    CHECKPOINT_RETENTION_HOURS: ${CHECKPOINT_RETENTION_HOURS:-24}
    CHECKPOINT_JANITOR_INTERVAL_SECONDS: ${CHECKPOINT_JANITOR_INTERVAL_SECONDS:-600}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-text}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
    INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-1}
    # 不在这里覆盖 EMBEDDING_MODEL：模型是构建镜像时下载的，运行时换名字只会启动失败（见 docker/api.Dockerfile）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 向量索引（decisions/0014、0016）。只是派生索引，数据以 PostgreSQL 为准，丢了可以重建
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"  # 默认会上报匿名使用统计，关掉
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # 镜像里没有 curl / wget，用 bash 的 /dev/tcp 发一个最简单的 HTTP 请求查就绪接口
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 一次性任务：建表/迁移后退出（restart: "no"），api 等它成功后再启动
  # 先跑我们自己的 Alembic 迁移，再建 LangGraph checkpoint 表（那套表由 LangGraph 自己管理）
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m agentnexus.storage.checkpoint"]
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    volumes:
      - blob_data:/data/blobs  # 知识库文档原件（不放进数据库）
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # slim 镜像没有 curl，用标准库探测
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 前端：Nginx 提供打包后的静态文件，并把 /api 转发给 api（同源，不需要 CORS）
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  blob_data:
  pg_data:
  qdrant_data:
  redis_data:
