# postgres + redis + migrate（一次性）+ api。后续阶段在此基础上叠加 qdrant / minio / neo4j / worker。
name: agentnexus

# api 与 migrate 共用同一个镜像和环境变量
x-backend: &backend
  image: agentnexus-backend
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  environment:
    # 容器间用服务名互通（postgres / redis），不是 localhost
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    # compose 只会把这里列出的变量传进容器；.env 里写了但这里没列的，容器里读不到
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
    SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-5}
    LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 一次性任务：建表/迁移后退出（restart: "no"），api 等它成功后再启动
  # 先跑我们自己的 Alembic 迁移，再建 LangGraph checkpoint 表（那套表由 LangGraph 自己管理）
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m agentnexus.storage.checkpoint"]
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # slim 镜像没有 curl，用标准库探测
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
