# postgres + redis + qdrant + neo4j + migrate（一次性）+ api + worker + web，
# 以及工具执行（decisions/0021）：sandbox（独占 Docker socket）+ mcp-gateway + egress-proxy。
name: agentnexus

# api、worker 与 migrate 共用同一个镜像和环境变量
x-backend-env: &backend-env
  # 容器间用服务名互通（postgres / redis），不是 localhost
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  # compose 只会把这里列出的变量传进容器；.env 里写了但这里没列的，容器里读不到
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
  SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-5}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-10}
  RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_THINKING: ${LLM_THINKING:-}
  LLM_FAKE_STREAM_DELAY: ${LLM_FAKE_STREAM_DELAY:-0}
  CHECKPOINT_RETENTION_HOURS: ${CHECKPOINT_RETENTION_HOURS:-24}
  CHECKPOINT_JANITOR_INTERVAL_SECONDS: ${CHECKPOINT_JANITOR_INTERVAL_SECONDS:-600}
  ORPHAN_BLOB_GRACE_HOURS: ${ORPHAN_BLOB_GRACE_HOURS:-24}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  QDRANT_URL: http://qdrant:6333
  NEO4J_URL: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?在 .env 里设置 NEO4J_PASSWORD}
  KG_MAX_CHUNKS_PER_BUILD: ${KG_MAX_CHUNKS_PER_BUILD:-2000}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
  INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-1}
  # 解析上传的 PDF / Word：在子进程里进行，超时或超过内存上限就终止（decisions/0025）
  PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-60}
  PARSE_MEMORY_MB: ${PARSE_MEMORY_MB:-1024}
  EMBEDDING_THREADS: ${EMBEDDING_THREADS:-}
  RERANK_ENABLED: ${RERANK_ENABLED:-true}
  RERANK_CANDIDATES: ${RERANK_CANDIDATES:-10}
  KNOWLEDGE_PREFETCH: ${KNOWLEDGE_PREFETCH:-true}
  KNOWLEDGE_PREFETCH_FOLLOWUP: ${KNOWLEDGE_PREFETCH_FOLLOWUP:-true}
  KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-4}
  # 深度调研（decisions/0022）
  RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-900}
  RESEARCH_MAX_SUBTASKS: ${RESEARCH_MAX_SUBTASKS:-5}
  RESEARCH_CONCURRENCY: ${RESEARCH_CONCURRENCY:-3}
  APPROVAL_TTL_HOURS: ${APPROVAL_TTL_HOURS:-24}
  # 登录（decisions/0023）。本地 http 演示时 COOKIE_SECURE 必须是 false，否则浏览器不保存会话 Cookie
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # 登录限流（decisions/0025）：同一账号同一 IP / 同一 IP 在窗口内的尝试上限
  LOGIN_PAIR_LIMIT: ${LOGIN_PAIR_LIMIT:-5}
  LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-30}
  LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
  # 不在这里覆盖 EMBEDDING_MODEL / RERANK_MODEL：模型是构建镜像时下载的，运行时换名字只会启动失败（见 docker/api.Dockerfile）

x-backend: &backend
  image: agentnexus-backend
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  environment: *backend-env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 向量索引（decisions/0014、0016）。只是派生索引，数据以 PostgreSQL 为准，丢了可以重建
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"  # 默认会上报匿名使用统计，关掉
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # 镜像里没有 curl / wget，用 bash 的 /dev/tcp 发一个最简单的 HTTP 请求查就绪接口
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 知识图谱的图查询存储（decisions/0019）。派生数据：实体、关系、出处以 PostgreSQL 为准，可以整体重建
  neo4j:
    image: neo4j:2026.08.1-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?在 .env 里设置 NEO4J_PASSWORD}
      # demo 规模的内存：堆 512m + 页缓存 256m（基准测试 5 万实体时用的是 1g / 512m）
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"  # 默认会上报使用统计，关掉
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"  # 浏览器控制台（Neo4j Browser），本地调试 Cypher 用
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      # 能连上 HTTP 端口即视为就绪（镜像里有 wget）；JVM 启动较慢，给足启动时间
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7474"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # 一次性任务：建表/迁移后退出（restart: "no"），api 等它成功后再启动
  # 先跑我们自己的 Alembic 迁移，再建 LangGraph checkpoint 表（那套表由 LangGraph 自己管理）
  # 最后创建 / 更新数据库角色并授权（decisions/0023）：api 用受 RLS 约束的普通角色，worker 用 BYPASSRLS 角色。
  # 必须在建表之后执行：授权只覆盖已经存在的表，所以每次部署都要跑一遍（幂等）
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m agentnexus.storage.checkpoint && python -m agentnexus.storage.roles"]
    environment:
      <<: *backend-env
      DB_API_PASSWORD: ${DB_API_PASSWORD:?在 .env 里设置 DB_API_PASSWORD}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?在 .env 里设置 DB_WORKER_PASSWORD}
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # 受 RLS 约束的普通角色（decisions/0023）：超级用户和表所有者都会绕过 RLS
      DATABASE_URL: postgresql://agentnexus_api:${DB_API_PASSWORD:?在 .env 里设置 DB_API_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 客户端 IP 取 Nginx 设置的 X-Real-IP（登录限流用）。前提是 api 只经 Nginx 访问：
      # 下面的端口只绑定在 127.0.0.1 上（本机调试用），生产部署时不要对外暴露 api 端口（decisions/0025）
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - blob_data:/data/blobs  # 知识库文档原件（不放进数据库）
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      # slim 镜像没有 curl，用标准库探测
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 后台任务（decisions/0020）：对话 run、文档入库、图谱构建、checkpoint 清理。可以起多个副本
  # （docker compose up -d --scale worker=2）：认领靠 PostgreSQL 租约，不会重复执行；某个副本崩溃，任务在租约过期后被接管续做
  worker:
    <<: *backend
    command: ["python", "-m", "agentnexus.worker"]
    environment:
      <<: *backend-env
      # BYPASSRLS 角色（decisions/0023）：后台任务按 run / 文档的归属取数据，不是“以某个用户的身份”查询
      DATABASE_URL: postgresql://agentnexus_worker:${DB_WORKER_PASSWORD:?在 .env 里设置 DB_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 工具（decisions/0021）：worker 只是 HTTP 客户端，不持有 Docker socket、不运行第三方 MCP 服务。
      # sandbox / mcp-gateway 没起来时 worker 照常运行，只是没有对应的工具（依赖它们的技能也不出现）
      SANDBOX_URL: http://sandbox:8000
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?在 .env 里设置 SANDBOX_TOKEN（至少 16 位随机字符）}
      SANDBOX_EXEC_TIMEOUT: ${SANDBOX_EXEC_TIMEOUT:-30}
      MCP_GATEWAY_URL: http://mcp-gateway:8080/mcp
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-8}
    networks: [default, sandbox, tools]
    volumes:
      - blob_data:/data/blobs  # 文档入库要读原件
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      # worker 每 10 秒更新一次这个文件；30 秒没更新说明事件循环卡住了
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/agentnexus-worker-alive') < 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s  # 启动时要加载 embedding 和重排模型
    # 关停时要放弃执行中任务的租约（让别的副本立即接手），给足时间；超时会被 SIGKILL，那就只能等租约自然过期
    stop_grace_period: 30s
    restart: unless-stopped

  # ---------- 工具执行（decisions/0021） ----------
  # 沙盒运行镜像：只负责构建镜像（sandbox 服务用它创建一次性容器），构建完打印一行就退出
  sandbox-runtime:
    image: agentnexus-sandbox-runtime
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    network_mode: none
    restart: "no"

  # 唯一持有 Docker socket 的服务（持有 socket = 宿主机 root）。对 worker 只开放窄接口：
  # 在某个工作空间里、用写死的加固参数执行代码，以及读写该工作空间的文件。不拿数据库、模型等任何密钥
  sandbox:
    image: agentnexus-backend
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["uvicorn", "agentnexus.sandbox.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?在 .env 里设置 SANDBOX_TOKEN（至少 16 位随机字符）}
      SANDBOX_IMAGE: agentnexus-sandbox-runtime
      SANDBOX_ROOT: /workspaces
      # 创建容器时按“卷 + 子目录”挂载（volume subpath）：这里的路径是 sandbox 容器里的，Docker 不认识；
      # 卷名是 Docker 认识的，每个容器只挂自己那个工作空间的子目录
      SANDBOX_VOLUME: ${COMPOSE_PROJECT_NAME}_sandbox_workspaces
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-256m}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_workspaces:/workspaces
    networks: [sandbox]  # 只和 worker 相通；MCP 网关里的第三方代码连不到它
    depends_on:
      sandbox-runtime:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 第三方 MCP 服务在这里以子进程运行（每次调用一个新进程）。只接入 internal 网络，只能经 egress-proxy 出网
  mcp-gateway:
    build:
      context: .
      dockerfile: docker/mcp-gateway.Dockerfile
    environment:
      MCP_SERVERS: '{"fetch": {"command": "python", "args": ["-m", "mcp_server_fetch", "--proxy-url", "http://egress-proxy:3128"]}}'
      MCP_CALL_TIMEOUT: ${MCP_CALL_TIMEOUT:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs: [/tmp]
    networks: [tools]
    depends_on: [egress-proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 出口代理：按“解析后的 IP”拒绝私有、回环、链路本地等地址（内部服务、宿主机、云元数据），只放行外网的 80/443
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./docker/squid.conf:/etc/squid/squid.conf:ro
    networks: [tools, egress]
    restart: unless-stopped

  # 前端：Nginx 提供打包后的静态文件，并把 /api 转发给 api（同源，不需要 CORS）
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  default:
  sandbox:
    internal: true
  tools:
    internal: true  # 不通外网：网关只能经 egress-proxy 出去
  egress:  # 只有 egress-proxy 接入，用来出外网

volumes:
  sandbox_workspaces:
    # 显式卷名：sandbox 服务创建容器时要按名字挂载子目录。带上项目名：同一台机器起第二套环境（-p 另一个名字）时不会共用工作空间
    name: ${COMPOSE_PROJECT_NAME}_sandbox_workspaces
  blob_data:
  pg_data:
  qdrant_data:
  neo4j_data:
  redis_data:
