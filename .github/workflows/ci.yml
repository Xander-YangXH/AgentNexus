# 持续集成（阶段 6.2）：每次推送和拉取请求都跑一遍。
# - backend：ruff 代码检查 + 全部集成测试（真实的 PostgreSQL、Redis、Neo4j；沙盒测试用 runner 自带的 Docker）；
# - frontend：类型检查 + 单元测试 + 生产构建；
# - images：用模板 .env 校验 compose 文件，并构建所有镜像（Dockerfile 坏了在这里发现）。
# 不调用真实模型：自动化测试一律用假模型（真实模型的两个测试在没有本地模型缓存时自动跳过）。
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentnexus
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agentnexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentnexus" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      neo4j:
        image: neo4j:2026.08.1-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474" --health-interval 5s --health-timeout 3s
          --health-retries 30 --health-start-period 20s
    env:
      DATABASE_URL: postgresql://agentnexus:ci-password@localhost:5432/agentnexus
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URL: bolt://localhost:7687
      NEO4J_PASSWORD: ci-neo4j-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies（按锁文件，与镜像同一套版本）
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Sandbox image for sandbox tests
        run: docker pull python:3.12-slim
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid with the template .env
        run: cp .env.template .env && docker compose config -q
      - name: Build all images
        run: docker compose build
